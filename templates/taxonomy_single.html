<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ term.name }}</title>
</head>
<body>
  <h1>{{ term.name }}</h1>
  <ul>
  {% for page in term.pages %}
    <li><a href="{{ page.permalink }}">{{ page.title }}</a> — {{ page.date }}</li>
  {% endfor %}
  </ul>
  <p><a href="/blog/">← Back to blog</a></p>
</body>
</html>
