<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ section.title }}</title>
</head>
<body>
  <h1>{{ section.title }}</h1>
  {% for page in section.pages %}
  <article>
    <h2><a href="{{ page.permalink }}">{{ page.title }}</a></h2>
    <time>{{ page.date }}</time>
    {% if page.summary %}
    <p>{{ page.summary | safe }}</p>
    {% endif %}
  </article>
  {% endfor %}
</body>
</html>
