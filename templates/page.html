<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} | {{ config.title | default(value="Side Effects") }}</title>
</head>
<body>
  <h1><a href="/">{{ config.title | default(value="Side Effects") }}</a></h1>
  <article>
    <h2>{{ page.title }}</h2>
    <time datetime="{{ page.date }}">{{ page.date }}</time>
    {% if page.taxonomies.tags is defined %}
    <span>
      {% for tag in page.taxonomies.tags %}
      <a href="{{ get_taxonomy_url(kind="tags", name=tag) }}">{{ tag }}</a>{% if not loop.last %}, {% endif %}
      {% endfor %}
    </span>
    {% endif %}
    <div>{{ page.content | safe }}</div>
  </article>
  <p><a href="/blog/">← Back to blog</a></p>
</body>
</html>
