<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ taxonomy.name | title }}</title>
</head>
<body>
  <h1>{{ taxonomy.name | title }}</h1>
  <ul>
  {% for term in terms %}
    <li><a href="{{ term.permalink }}">{{ term.name }} ({{ term.pages | length }})</a></li>
  {% endfor %}
  </ul>
  <p><a href="/blog/">← Back to blog</a></p>
</body>
</html>
